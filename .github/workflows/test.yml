name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Test against every Node version declared in the engines field so that
    # a Node-18-specific incompatibility is caught in CI before shipping.
    # Add new versions here whenever the engines minimum is raised.
    strategy:
      matrix:
        node-version: [18, 20]
    name: Test (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
